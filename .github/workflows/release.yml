name: Release

# release-please keeps one release PR open on main. Merging it creates the
# tag and GitHub Release; the publish job then runs in this same workflow.
# npm trusts this file (release.yml) as the package's trusted publisher, so
# the repository stores no npm token; renaming it breaks publishing. The
# trusted publisher may only stage: a maintainer approves each staged
# version with 2FA (npm stage approve, or the Staged Packages tab) before
# it goes live, so a compromised workflow cannot ship a release alone.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # release-please writes with the release App's installation token, not
    # GITHUB_TOKEN, so this job grants the default token nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release PR is opened with a token minted from the
      # dougborg-release-please GitHub App instead of GITHUB_TOKEN, so the
      # pull_request workflows behind the required checks run on it
      # (GITHUB_TOKEN-authored events never trigger other workflows).
      # Without the App credentials the job fails here rather than falling
      # back to GITHUB_TOKEN and opening a release PR that cannot pass.
      - name: Require the release App credentials
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          PRIVATE_KEY_SET: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$PRIVATE_KEY_SET" != "true" ]; then
            echo "::error::Set the RELEASE_PLEASE_APP_ID variable and RELEASE_PLEASE_APP_PRIVATE_KEY secret (dougborg-release-please App); see docs/releasing.md."
            exit 1
          fi
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Only what release-please uses: the release branch, tags and
          # Releases (contents), the release PR (pull-requests), and its
          # autorelease labels (issues).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in the release build: a poisoned cache could
      # reach the published package.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: Stage the release for maintainer approval
        run: npm stage publish . --provenance --access public
